<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌾 Smart Agro Bot</title>

<!-- NLP (TensorFlow.js) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder"></script>

<style>
*{box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{margin:0;display:flex;height:100vh;background:#e8dfcc;color:#2e2e2e;}
.sidebar{width:260px;background:#2e5d3a;color:white;display:flex;flex-direction:column;padding:25px;}
.sidebar h1{font-size:24px;margin-bottom:5px;}
.sidebar button{background:#376b44;border:none;color:white;padding:10px;margin:10px 0;border-radius:8px;cursor:pointer;}
.main{flex:1;display:flex;gap:20px;padding:30px;}
.chat,.tools{flex:1;background:#f0e6cc;border-radius:16px;padding:20px;display:flex;flex-direction:column;}
.chat-box{flex:1;overflow-y:auto;border:1px solid #d1c7a4;border-radius:12px;padding:15px;background:#f7efd8;}
.msg{max-width:75%;margin:8px 0;padding:10px;border-radius:10px;}
.user{background:#2e5d3a;color:white;margin-left:auto;}
.bot{background:#fff4d4;}
.chat-input{display:flex;gap:5px;margin-top:10px;}
.chat-input input{flex:1;padding:10px;border-radius:8px;border:1px solid #bfae7e;}
.chat-input button{background:#2e5d3a;color:white;border:none;padding:10px;border-radius:8px;}
</style>
</head>

<body>

<div class="sidebar">
  <h1>🌾 AgroBot</h1>
  <button onclick="showChat()">Chat</button>
  <button onclick="showTools()">Crop Tools</button>
</div>

<div class="main">

<div class="chat" id="chatPanel">
  <h2>Chat</h2>
  <div class="chat-box" id="chatBox"></div>
  <div class="chat-input">
    <input id="userInput" placeholder="Ask anything...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<div class="tools" id="toolsPanel" style="display:none;">
  <h2>Suggestions</h2>
  <select id="soil">
    <option>Sandy</option><option>Clay</option><option>Loamy</option>
  </select>
  <select id="month">
    <option>June</option><option>January</option>
  </select>
  <button onclick="showSuggestion()">Show</button>
  <p id="result"></p>
</div>

</div>

<script>
const chatBox=document.getElementById("chatBox");
const userInput=document.getElementById("userInput");

function sendMessage(){
  const text=userInput.value;
  if(!text)return;
  addMsg(text,"user");
  userInput.value="";
  generateReply(text);
}

function addMsg(text,type){
  const msg=document.createElement("div");
  msg.className="msg "+type;
  msg.textContent=text;
  chatBox.appendChild(msg);
}

// NLP Model
let model;
async function loadModel(){
  model=await use.load();
}
loadModel();

async function generateReply(text){
  const intents=[
    {pattern:"irrigation water",response:"Use drip irrigation for best results."},
    {pattern:"fertilizer manure",response:"Use organic compost."},
    {pattern:"soil types",response:"India has alluvial, black, red soils."}
  ];

  const input=await model.embed([text]);

  let bestScore=0;
  let bestReply="I am still learning.";

  for(let i of intents){
    const emb=await model.embed([i.pattern]);
    const score=cosine(input,emb);
    if(score>bestScore){
      bestScore=score;
      bestReply=i.response;
    }
  }

  addMsg(bestReply,"bot");
}

function cosine(a,b){
  return tf.tidy(()=>{
    const dot=tf.sum(tf.mul(a,b));
    const normA=tf.norm(a);
    const normB=tf.norm(b);
    return dot.div(normA.mul(normB)).dataSync()[0];
  });
}

function showSuggestion(){
  document.getElementById("result").textContent="Try rice or wheat based on season.";
}

function showChat(){
  document.getElementById("chatPanel").style.display="flex";
  document.getElementById("toolsPanel").style.display="none";
}

function showTools(){
  document.getElementById("toolsPanel").style.display="flex";
  document.getElementById("chatPanel").style.display="none";
}
</script>

</body>
</html>
