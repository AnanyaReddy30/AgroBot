<!DOCTYPE html>
<html>
<head>
  <title>AgroBot 🌾</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5dc;
      margin: 0;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 200px;
      background: #2e5d3a;
      color: white;
      padding: 20px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    #chatBox {
      flex: 1;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      background: white;
    }

    .msg {
      margin: 5px 0;
      padding: 8px;
      border-radius: 8px;
      max-width: 70%;
    }

    .user {
      background: #2e5d3a;
      color: white;
      margin-left: auto;
    }

    .bot {
      background: #eee;
    }

    .input-area {
      display: flex;
      margin-top: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
    }

    button {
      padding: 10px;
      background: #2e5d3a;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>🌾 AgroBot</h2>
</div>

<div class="main">
  <div id="chatBox"></div>

  <div class="input-area">
    <input id="userInput" placeholder="Ask something..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>

function addMsg(text, type) {
  const msg = document.createElement("div");
  msg.className = "msg " + type;
  msg.textContent = text;
  document.getElementById("chatBox").appendChild(msg);
}

function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();

  if (!text) return;

  addMsg(text, "user");
  input.value = "";

  generateReply(text);
}

async function generateReply(text) {
  try {
    const res = await 
fetch("https://agrobot-backend-i3dg.onrender.com/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    addMsg(data.reply, "bot");

  } catch (err) {
    addMsg("⚠️ Backend not responding", "bot");
    console.error(err);
  }
}

</script>

</body>
</html>
